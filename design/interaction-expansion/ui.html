<!doctype html><html><head><meta charset="utf-8"><style>body{font:13px Inter,Arial,sans-serif;margin:20px;color:#101a2e;background:#f5f7fa}h1{font-size:22px}p{line-height:1.5}button{padding:10px 12px;border:0;border-radius:4px;background:#2d5fd2;color:white;cursor:pointer;margin:4px 4px 4px 0}button:disabled{opacity:.5}#status{padding:12px;background:white;border:1px solid #e2e6ed;white-space:pre-wrap;max-height:100px;overflow:auto;margin:12px 0}select,input{padding:8px;width:100%;margin:5px 0;border:1px solid #e2e6ed}</style></head><body><h1>Softwallet · complete flows</h1><p>Editable customer journeys and admin screens. Existing originals stay intact. No network access.</p><button id="customer">Build customer journeys</button><button id="admin">Build admin workspace</button><div id="status">Ready. Select a build or inspect an existing screen.</div><select id="screens"><option>Choose a generated screen</option></select><input id="key" placeholder="admin/products/desktop" aria-label="Screen key"><button id="focus">Show screen</button><button id="export">Export PNG</button><button id="repair">Repair layout</button><button id="audit">Audit screens</button><button id="report">Save report</button><button id="close">Close</button><script>let report=null;const status=document.getElementById('status');const post=m=>parent.postMessage({pluginMessage:m},'*');const download=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()};for(const area of ['customer','admin'])document.getElementById(area).onclick=()=>{status.textContent='Preparing editable screens…';for(const a of ['customer','admin'])document.getElementById(a).disabled=true;post({type:'build',area})};onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.text)status.textContent=m.text;if(m.report){report=m.report;document.getElementById('screens').innerHTML='<option value="">Choose a generated screen</option>'+report.screens.map(s=>'<option value="'+s.id+'">'+(s.key||s.name)+' '+(s.mode||'')+'</option>').join('')}if(m.type==='image')download(new Blob([new Uint8Array(m.bytes)],{type:'image/png'}),m.name);if(m.type==='done'||m.type==='error')for(const a of ['customer','admin'])document.getElementById(a).disabled=false;};for(const type of ['focus','export'])document.getElementById(type).onclick=()=>post({type,id:document.getElementById('screens').value,key:document.getElementById('key').value});document.getElementById('repair').onclick=()=>post({type:'repair'});document.getElementById('audit').onclick=()=>post({type:'audit'});document.getElementById('report').onclick=()=>{if(report)download(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),'softwallet-design-report.json')};document.getElementById('close').onclick=()=>post({type:'close'});</script></body></html>
